<title>Murmur Music</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Murmur">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: library rail on the left, scrolling main view, a transport bar pinned across the bottom; on phones the rail becomes a bottom tab bar. One committed dark look, warm brass accent on cool graphite. */
:root{
  color-scheme:dark;
  --bg:#0f1213;
  --rail:#151a1b;
  --surface:#1b2122;
  --raise:#252c2e;
  --line:rgba(214,236,232,.08);
  --fg:#eef1ef;
  --muted:#93a19e;
  --accent:#f0b44c;
  --accent-ink:#1d1405;
  --accent-soft:rgba(240,180,76,.14);
  --danger:#ff8d7a;
  --display:"Unbounded", ui-sans-serif, system-ui, sans-serif;
  --body:"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--fg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

.app{position:fixed;inset:0;display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.side{background:var(--rail);border-right:1px solid var(--line);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 12px 20px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;padding:0 10px 18px}
.brand-mark{width:26px;height:22px;display:flex;align-items:flex-end;gap:3px}
.brand-mark i{flex:1;background:var(--accent);border-radius:2px}
.brand-mark i:nth-child(1){height:45%}.brand-mark i:nth-child(2){height:100%}.brand-mark i:nth-child(3){height:70%}.brand-mark i:nth-child(4){height:35%}
.nav{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:600;width:100%;text-align:left}
.nav:hover{color:var(--fg);background:rgba(255,255,255,.03)}
.nav.on{color:var(--fg);background:var(--surface)}
.nav .count{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.side-head{display:flex;align-items:center;justify-content:space-between;margin:22px 10px 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--fg);background:var(--raise)}
.pl-link{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;width:100%;text-align:left;color:var(--muted)}
.pl-link:hover{color:var(--fg);background:rgba(255,255,255,.03)}
.pl-link.on{color:var(--fg);background:var(--surface)}
.pl-link .art{width:34px;height:34px;border-radius:6px;flex:none}
.pl-link span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}

main{overflow-y:auto;-webkit-overflow-scrolling:touch;min-width:0;position:relative}
.view{padding-inline:clamp(16px,3.2vw,40px);padding-block:calc(env(safe-area-inset-top,0px) + 28px) 40px;max-width:1240px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.6vw,40px);letter-spacing:-.02em;margin:6px 0 0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.section{margin-top:36px;display:flex;flex-direction:column;gap:14px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{color:var(--muted);font-weight:600;font-size:13px}
.link:hover{color:var(--fg)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{height:40px;padding-inline:18px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--raise)}
.btn.ghost:hover{background:#2f3739}
.btn.danger{background:rgba(255,141,122,.12);color:var(--danger)}
.btn.small{height:32px;padding-inline:14px;font-size:13px}
.play-big{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play-big svg.i{width:24px;height:24px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding-inline:14px;border-radius:999px;background:var(--surface);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--fg);color:var(--bg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:22px 18px}
.card{display:flex;flex-direction:column;gap:9px;text-align:left;min-width:0;position:relative}
.card .art{aspect-ratio:1;width:100%;max-width:100%;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.card b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
.card .hover-play{position:absolute;right:10px;top:calc(100% - 96px);width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.card:hover .hover-play,.card:focus-visible .hover-play,.card.now .hover-play{opacity:1;transform:none}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:18px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}

.art{background:var(--raise);background-size:cover;background-position:center;display:grid;place-items:center;overflow:hidden;position:relative;color:rgba(255,255,255,.85);font-family:var(--display);font-weight:700}
.art.quad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.art.quad i{background-size:cover;background-position:center}

.tracks{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:34px 44px minmax(0,1fr) minmax(0,.7fr) 40px 56px 36px;align-items:center;gap:12px;padding:6px 8px;border-radius:9px;min-height:56px}
.tr:hover{background:rgba(255,255,255,.035)}
.tr.now{background:var(--accent-soft)}
.tr .idx{color:var(--muted);text-align:center;font-size:13px;display:grid;place-items:center;height:30px}
.tr .idx .pi{display:none}
.tr:hover .idx .n,.tr.now .idx .n{display:none}
.tr:hover .idx .pi,.tr.now .idx .pi{display:grid}
.tr.now .idx,.tr.now .tt b{color:var(--accent)}
.tr .art{width:44px;height:44px;border-radius:6px;font-size:13px}
.tt{min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.tt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .album{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .dur{color:var(--muted);font-size:13px;text-align:right}
.tr .heart,.tr .more{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tr .heart:hover,.tr .more:hover{color:var(--fg);background:var(--raise)}
.heart.on{color:var(--accent)!important}
.heart.on svg.i{fill:currentColor}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.tracks-head{display:grid;grid-template-columns:34px 44px minmax(0,1fr) minmax(0,.7fr) 40px 56px 36px;gap:12px;padding:0 8px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
@media (max-width:760px){
  .tr,.tracks-head{grid-template-columns:44px minmax(0,1fr) 34px 34px;gap:10px}
  .tr .idx,.tr .album,.tr .dur,.tracks-head .h-idx,.tracks-head .h-album,.tracks-head .h-dur{display:none}
  .tracks-head{display:none}
}

.hero{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.hero .art{width:clamp(130px,18vw,200px);height:clamp(130px,18vw,200px);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);font-size:44px}
.hero-text{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.hero-meta{color:var(--muted);font-size:13px}
.hero-tools{display:flex;align-items:center;gap:14px;margin:24px 0 18px;flex-wrap:wrap}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;max-width:680px;line-height:1.5}
.notice b{font-size:15px}
.notice p{margin:0;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted)}
.empty b{color:var(--fg);font-size:16px}
.drop-hint{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:20px;background:rgba(15,18,19,.82);display:grid;place-items:center;z-index:60;font-family:var(--display);font-size:22px;pointer-events:none}
.search-box{display:flex;align-items:center;gap:10px;height:48px;border-radius:999px;background:var(--surface);padding-inline:18px;max-width:560px;border:1px solid var(--line)}
.search-box input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px}
.skeleton{background:linear-gradient(90deg,var(--surface),var(--raise),var(--surface));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}

.libs{display:flex;flex-direction:column;gap:12px;max-width:680px}
.lib{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.lib-top{display:flex;align-items:center;gap:16px}
.lib-top .tt{flex:1}
.lib-top .tt b{font-size:15px}
.lib-top .tt span{line-height:1.45;margin-top:2px}
.jm{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.toggle{position:relative;width:46px;height:28px;border-radius:14px;background:var(--raise);flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.toggle[aria-checked="true"]{background:var(--accent-soft)}
.toggle[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent)}
input[type=range]:disabled{opacity:.35}
.stage{position:fixed;z-index:45;right:16px;bottom:100px;width:360px;max-width:calc(100vw - 32px);background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.6)}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 12px;background:var(--surface);font-size:12px;color:var(--muted);font-weight:600}
#stageSlot{width:100%;aspect-ratio:16/9;max-width:100%}
.stage[data-kind=soundcloud] #stageSlot{aspect-ratio:auto;height:200px}
.stage[data-kind=spotify] #stageSlot{aspect-ratio:auto;height:152px}
#stageSlot iframe,#stageSlot>div{width:100%;height:100%;border:0;display:block}
body.has-stage .view{padding-bottom:300px}
@media (max-width:899px){.stage{left:8px;right:8px;width:auto;max-width:none;bottom:calc(env(safe-area-inset-bottom,0px) + 132px)}}
/* transport */
.player{grid-column:1/-1;background:#0b0e0f;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:16px;
  padding:10px calc(env(safe-area-inset-right,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 14px);min-height:84px}
.np-info{display:flex;align-items:center;gap:12px;min-width:0}
.np-info .art{width:54px;height:54px;border-radius:7px;flex:none;font-size:16px}
.np-info .tt b{font-size:14px}
.np-open{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.ctrls{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ctrl-row{display:flex;align-items:center;gap:14px}
.cb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);position:relative}
.cb:hover{color:var(--fg)}
.cb.on{color:var(--accent)}
.cb.on::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cb .one{position:absolute;top:5px;right:4px;font-size:9px;font-weight:800}
.pp{width:40px;height:40px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.pp:hover{transform:scale(1.04)}
.seek{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;font-size:11.5px;color:var(--muted)}
.seek span{width:38px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:18px;background:none;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fg) var(--p),#3a4446 var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fg) var(--p),#3a4446 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);margin-top:-4px;opacity:0;transition:opacity .12s}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--fg)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
.right-tools{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.vol{display:flex;align-items:center;gap:6px;width:150px}
.mini-pp{display:none}

.tabs{display:none}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto}
  .side{display:none}
  .player{grid-template-columns:minmax(0,1fr) auto;padding:8px 10px;min-height:0;margin:0 8px 6px;border:0;border-radius:12px;background:var(--raise)}
  .player .ctrls,.player .right-tools{display:none}
  .np-info .art{width:42px;height:42px}
  .mini-pp{display:flex;align-items:center;gap:4px}
  .tabs{display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 14px}
  .tab.on{color:var(--fg)}
}

/* full now-playing sheet */
.np{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 70% at 50% 0%,var(--np-tint,#2a2f30) 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);overflow-y:auto}
.np-top{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between}
.np-top .eyebrow{text-align:center}
.np-art{width:min(78vw,420px,46vh);aspect-ratio:1;border-radius:14px;margin:26px 0 24px;box-shadow:0 26px 60px rgba(0,0,0,.5);font-size:64px;max-width:100%}
.np-meta{width:100%;max-width:520px;display:flex;align-items:center;gap:12px}
.np-meta .tt b{font-family:var(--display);font-weight:500;font-size:22px;white-space:normal}
.np-meta .tt span{font-size:15px}
.np .seek{max-width:520px;margin-top:18px}
.np .ctrl-row{margin-top:10px;gap:26px}
.np .pp{width:66px;height:66px}
.np .pp svg.i{width:28px;height:28px}

/* menus, sheets, toast */
.menu{position:fixed;z-index:70;min-width:220px;max-width:calc(100vw - 24px);background:#232a2c;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;padding:10px 12px;border-radius:8px;text-align:left;font-weight:500}
.menu button:hover{background:var(--raise)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,7,8,.66);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(440px,100%);max-height:86%;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:19px}
.sheet p{margin:0;color:var(--muted);line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.field input{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--raise);padding:0 12px;font-size:15px;font-weight:500}
.sheet-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;text-align:left;width:100%}
.pick:hover{background:var(--raise)}
.pick .art{width:42px;height:42px;border-radius:7px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translate(-50%,8px);background:var(--fg);color:var(--bg);font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <footer class="player" id="player"></footer>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="np" id="np" hidden></div>
<div class="stage" id="stage" hidden><div class="stage-head"><span id="stageLabel">Playing</span><span class="row-actions" style="gap:6px"><a id="stageLink" class="link" href="#" target="_blank" rel="noopener">Open</a><button class="icon-btn" data-act="stagestop" aria-label="Stop and close player" style="width:26px;height:26px">✕</button></span></div><div id="stageSlot"></div></div>
<div class="menu" id="menu" hidden></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="drop-hint" id="dropHint" hidden>Drop songs to add them</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac" multiple hidden>

<script>
'use strict';
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const fmt = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ============ events ============ */
document.addEventListener('click', e => {
  if (!e.target.closest('#menu') && !e.target.closest('[data-act=menu],[data-act=plmenu]')) closeMenu();
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;

    case 'play': { const l = listOf(), i = +b.dataset.i, t = l[i]; if (t && current() && current().key === t.key && S.base.length === l.length) togglePlay(); else playFrom(l, i); break; }

    case 'shuffleall': { const l = listOf(); if (!l.length) { toast('Nothing to play yet'); break; } if (!S.shuffle) { S.shuffle = true; prefs.shuffle = true; savePrefs(); } playFrom(l, Math.floor(Math.random() * l.length)); render(); break; }
    case 'toggle': togglePlay(); break;
    case 'next': next(false); break;
    case 'prev': prev(); break;
    case 'shuffle': toggleShuffle(); render(); break;
    case 'repeat': cycleRepeat(); break;
    case 'like': toggleLike(b.dataset.key); break;
    case 'mute': audio.muted = !audio.muted; if (mode === 'embed') embCall('vol', audio.muted ? 0 : audio.volume); renderPlayer(); break;

    case 'addlink': addLinkSheet(b.dataset.q || ''); break;
    case 'savekey': {

addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropHint').hidden = true; });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#dropHint').hidden = true; if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'Escape') { closeMenu(); closeSheet(); $('#np').hidden = true; }
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight' && e.shiftKey) next(false); else if (e.key === 'ArrowLeft' && e.shiftKey) prev();
  else if (e.key === 'ArrowRight' && P.dur) P.seek(Math.min(P.dur, P.time + 5));
  else if (e.key === 'ArrowLeft') P.seek(Math.max(0, P.time - 5));
});
$('#main').addEventListener('scroll', closeMenu, { passive: true });

/* ============ boot ============ */
(async () => {
  renderSide(); renderTabs(); renderPlayer(); render();
  await DB.init();
  const [songs, pls, liked, seeded, links] = await Promise.all([DB.songs(), DB.get('playlists'), DB.get('liked'), DB.get('seeded'), DB.get('links')]);
  S.links = Array.isArray(links) ? links : [];
  songs.forEach(s => S.songs.set(s.id, s)); S.playlists = Array.isArray(pls) ? pls : []; S.liked = Array.isArray(liked) ? liked : [];
  render(); renderSide();
  if (srcOn('audius')) await loadTrending(''); loadHome(); render();
  if (!seeded && !S.songs.size) {
    try { const ex = await makeExampleSongs(); for (const s of ex) { await DB.putSong(s); S.songs.set(s.id, s); } } catch (e) { console.warn(e); }
    await DB.set('seeded', true); render(); renderSide();
  }
})();
</script>
